# RC lint workflow — issue #668 / ADR 0011.
# Runs the commit-type classifier on every PR to an rc/v*
# branch and the release-blocker label check on the PR.
# Mirrors the lint-bake-bootstrap pattern in build.yml: a
# lightweight job that fails fast.

name: rc-lint

on:
  pull_request:
    branches: ['rc/**']
  push:
    branches: ['rc/**']

permissions:
  contents: read
  pull-requests: read

jobs:
  rc-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Just
        uses: extractions/setup-just@v2
        with:
          just-version: 1.57.0

      # Commit-type classifier (issue #668 / ADR 0011).
      # Walks every commit between the PR base (the merge-base
      # vs the rc/v* branch tip) and HEAD; rejects
      # feat/refactor/perf/build + missing-type commits
      # + oversized diffs (≥ 50 files).
      - name: lint-rc-commits (ADR 0011)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ -z "$BASE_REF" ] || [ -z "$HEAD_REF" ]; then
            echo "BASE_REF or HEAD_REF not set; skipping"
            exit 0
          fi
          just lint-rc-commits
        timeout-minutes: 3

      # Regression net on the classifier shape.
      - name: lint-rc-commits test (ADR 0011)
        shell: bash
        run: |
          just lint-rc-commits-test
        timeout-minutes: 2
