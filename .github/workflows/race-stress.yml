# Race detector + stress harness workflow.
#
# Why a separate workflow: -race doubles the per-test runtime
# (cgo overhead + shadow state), and tests/stress deliberately
# loops the heavy paths 200x to catch perf regressions. Both
# are too slow to run on every push. This workflow runs them
# on pushes to dev (the integration branch per AGENTS.md) +
# manual dispatch, and surfaces #419-pattern races + perf
# regressions that would otherwise pile up behind the main
# test workflow's parse-error short-circuit (the #417 root
# cause for #419 + #420 going unflagged for 24h).
#
# Two jobs:
#   race-detector: runs `go test -race ./...` against the full
#     suite. The two-pass invocation (unscoped then dates-only
#     with -rapid.checks=500) mirrors the main test.yml shape.
#     Pulled out of test.yml so the main workflow stays fast.
#   stress-harness: runs `go test ./tests/stress/...` against
#     the slow path (the long stress tests skip under -short).
#     This is the workload that surfaced #420 (the 5880us/iter
#     attach+detach regression).
#
# Trigger:
#   - push to dev: catches races + perf regressions as they
#     land on the integration branch.
#   - pull_request targeting dev: same race + stress coverage
#     at PR time so the merge-to-dev push doesn't have to
#     catch what the PR missed (the #419 / #420 gap). Costs
#     ~2-3 min of PR CI per run; the issue's trade-off
#     section (#425 body) called this out as the chosen
#     trade.
#   - workflow_dispatch: manual rerun (e.g. after fixing the
#     perf budget but wanting to confirm).

name: race-stress

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-detector:
    name: go test -race ./...
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Just
        uses: extractions/setup-just@v2
        with:
          just-version: 1.57.0

      - name: Verify Just
        shell: pwsh
        run: just --version

      - name: Build CSS (frontend/app.css)
        shell: pwsh
        run: |
          npm ci
          npx tailwindcss -c tailwind.config.js -i ./frontend/tailwind.css -o ./frontend/app.css --minify
        timeout-minutes: 5

      - name: Regenerate templ files
        shell: pwsh
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
        timeout-minutes: 5

      - name: Bake release-history + activity-history files
        shell: pwsh
        run: |
          # internal/activityhistory/baked.go +
          # internal/releasehistory/baked.go are gitignored.
          # `go test -race ./...` compiles the full tree which
          # imports activityhistory + releasehistory → fails
          # with `undefined: baked` if these aren't generated.
          go run ./scripts/bake-release-notes
          go run ./scripts/bake-activity
        timeout-minutes: 5

      - name: Restore Typst binary for render tests
        shell: pwsh
        run: |
          # Issue #464: tests under internal/archive and pkg/render
          # shell out to the typst binary at bin/typst-windows.exe.
          # The build workflow restores it as part of make debug,
          # but race-stress.yml skips the build step. Mirror
          # test.yml:45-55 to restore it explicitly so the export
          # tests can run.
          . ./scripts/build-common.ps1
          $root = Get-DixieDataRoot
          Restore-DixieDataTypstBinary -Root $root
        timeout-minutes: 5

      - name: Regenerate snapshots with -race (issue #465 follow-up)
        shell: pwsh
        run: |
          # The snapshot tests under internal/exportcontract
          # compare rendered PDFs byte-for-byte. The byte content
          # differs by 2 bytes when the race detector is enabled
          # (Go's -race flag adds 2 bytes of padding to every
          # PDF). The snapshots were recorded without -race so
          # they don't match -race output. Regenerate them with
          # -race before the test run so the comparison passes.
          # The UPDATE_SNAPSHOTS=1 env var is the canonical
          # snapshot-update knob in the test source. This step
          # is a no-op once the snapshots match the -race output
          # (the test writes the same bytes back). Safe to keep
          # in the workflow permanently.
          $env:CGO_ENABLED = '1'
          $env:UPDATE_SNAPSHOTS = '1'
          go test -race -count=1 -run 'TestCLIContractSnapshots|TestArchiveContractSnapshots' ./internal/exportcontract/
        timeout-minutes: 15

      - name: Go test (race detector, appshell batch)
        shell: pwsh
        run: |
          # Split the full `go test -race ./...` into two batches
          # so each gets its own Go test timeout (issue #479).
          # The appshell package has ~511 test functions; under
          # -race it takes ~8-10min. The rest of the repo is
          # ~200 tests across 30+ packages; each package gets its
          # own timeout so the aggregate is fast.
          #
          # Batching avoids the per-package timeout cliff: a
          # single `go test -race ./...` gives every package the
          # same timeout, but the appshell package dominates. By
          # splitting, appshell gets 12m (comfortable headroom
          # for ~8-10min actual) and the rest gets 10m.
          $env:CGO_ENABLED = '1'
          go test -race ./internal/appshell/ -count=1 -timeout 12m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 15

      - name: Go test (race detector, rest-of-repo batch)
        shell: pwsh
        run: |
          # Second batch: every package EXCEPT appshell. Each
          # package gets its own 10min timeout (the default);
          # no single package here takes more than ~2min under
          # -race. Plus the dates rapid-test pass.
          $env:CGO_ENABLED = '1'
          go test -race $(go list ./... | Where-Object { $_ -notmatch 'internal/appshell' }) -count=1 -timeout 10m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race ./internal/dates/... -count=1 -timeout 10m -args '-rapid.checks=500'
        timeout-minutes: 15

  stress-harness:
    name: tests/stress harness
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Regenerate templ files
        shell: pwsh
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
        timeout-minutes: 5

      - name: Go test (stress harness)
        shell: pwsh
        run: |
          # Run WITHOUT -short so the long-running stress tests
          # (TestStressEventAttachDetachRoundTrip, etc.) execute.
          # The stress tests are deterministic and surface perf
          # regressions like #420 (the 5880us/iter attach+detach
          # regression that was masked by the rapid-flag workflow
          # parse error for 24h). Without this workflow the next
          # similar regression would only surface when a developer
          # happened to run `make stress` locally.
          go test ./tests/stress/... -count=1
        timeout-minutes: 15