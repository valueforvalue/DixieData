# Test workflow — runs the short test suite on every push and PR.
# Pinned to Windows because the Wails app and stress harnesses are
# Windows-first (see Makefile); expand to a matrix later if needed.

name: test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build CSS (frontend/app.css)
        shell: pwsh
        run: |
          npm ci
          npx tailwindcss -c tailwind.config.js -i ./frontend/tailwind.css -o ./frontend/app.css --minify
        timeout-minutes: 5

      - name: Regenerate templ files
        shell: pwsh
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
        timeout-minutes: 5

      - name: Restore Typst binary for render tests
        shell: pwsh
        run: |
          # Tests under internal/archive and pkg/render shell out to
          # the typst binary at bin/typst-windows.exe. The build
          # workflow restores it as part of make debug, but the test
          # workflow skips the build step. Restore it explicitly so
          # the export tests can run.
          . ./scripts/build-common.ps1
          $root = Get-DixieDataRoot
          Restore-DixieDataTypstBinary -Root $root
        timeout-minutes: 5

      - name: Go test (short)
        shell: pwsh
        run: |
          go test ./... -short -count=1
        timeout-minutes: 15

      # Mirror the trace harness across both build-tag modes so the
      # //go:build debug and //go:build !debug files stay in sync.
      # Without this the no-op stub in trace_nodebug.go could rot
      # silently and release builds could carry dead code from any
      # future file added with //go:build debug.
      - name: Go test (debug tag — trace harness)
        shell: pwsh
        run: |
          go test -tags debug ./internal/debug/... -short -count=1
        timeout-minutes: 5

      - name: Bump-verify (no version drift)
        if: hashFiles('internal/versioninfo/versioninfo.go') != ''
        shell: pwsh
        run: |
          pwsh -File scripts/bump-version.ps1 -VerifyOnly

      # Schema-touching detector (build-protocol.md §4). If the
      # PR has any commit subject matching feat(db) / feat(schema)
      # / fix(db) AND CurrentSchemaVersion is unchanged from the
      # base branch, fail with a drift message. The skip hatch
      # is a commit subject 'chore: skip-schema-bump' + reason
      # in the body, used for cases like a performance-only
      # index change that doesn't need a bump.
      - name: Schema-touching bump detector
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = "${{ github.base_ref }}"
          $subjects = git log --format=%s "$base..HEAD" 2>$null
          $touches = $subjects | Where-Object { $_ -match '^(feat|fix)\((db|schema)\):' -or $_ -match '^feat\(schema\):' }
          if (-not $touches) {
            Write-Host "schema-touching: no feat(db)/feat(schema)/fix(db) commits in PR"
            exit 0
          }
          $skipHatch = $subjects | Where-Object { $_ -match '^chore: skip-schema-bump' }
          if ($skipHatch) {
            Write-Host "schema-touching: skip-schema-bump hatch found, allowing PR"
            exit 0
          }
          $currentHead = (git show "HEAD:internal/versioninfo/versioninfo.go" | Select-String 'CurrentSchemaVersion\s*=\s*(\d+)').Matches[0].Groups[1].Value
          $currentBase = (git show "origin/$($base):internal/versioninfo/versioninfo.go" | Select-String 'CurrentSchemaVersion\s*=\s*(\d+)').Matches[0].Groups[1].Value
          if ($currentHead -eq $currentBase) {
            Write-Host ""
            Write-Host "DRIFT: PR #${{ github.event.pull_request.number }} touches schema but did not bump CurrentSchemaVersion." -ForegroundColor Red
            Write-Host "Touching commits:" -ForegroundColor Yellow
            $touches | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "Either:" -ForegroundColor Yellow
            Write-Host "  1. Add a 'feat(schema): bump to v$($currentBase + 1)' commit in this PR"
            Write-Host "  2. Add a 'chore: skip-schema-bump' commit + reason in body (rare; for non-shape changes)"
            exit 1
          }
          Write-Host "schema-touching: schema bumped from $currentBase to $currentHead, OK"
