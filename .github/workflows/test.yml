# Test workflow — runs the short test suite on every push and PR.
# Pinned to Windows because the Wails app and stress harnesses are
# Windows-first (see Makefile); expand to a matrix later if needed.

name: test

on:
  push:
    branches: [dev, stable]
  pull_request:
    branches: [dev, stable]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build CSS (frontend/app.css)
        shell: pwsh
        run: |
          npm ci
          npx tailwindcss -c tailwind.config.js -i ./frontend/tailwind.css -o ./frontend/app.css --minify
        timeout-minutes: 5

      - name: Regenerate templ files
        shell: pwsh
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate
        timeout-minutes: 5

      - name: Restore Typst binary for render tests
        shell: pwsh
        run: |
          # Tests under internal/archive and pkg/render shell out to
          # the typst binary at bin/typst-windows.exe. The build
          # workflow restores it as part of make debug, but the test
          # workflow skips the build step. Restore it explicitly so
          # the export tests can run.
          . ./scripts/build-common.ps1
          $root = Get-DixieDataRoot
          Restore-DixieDataTypstBinary -Root $root
        timeout-minutes: 5

      - name: Go test (short, race detector — narrow scope)
        shell: pwsh
        run: |
          # -race requires cgo. CI runners have gcc on ubuntu-latest;
          # local Windows dev envs typically do not, so this gate lives
          # in CI only. Catches the concurrency bug class per
          # docs/COMMON_BUGS.md §4.1 (goroutine leak / race).
          #
          # NARROWED FROM UNSCOPED ./... (2026-07-13 follow-up to
          # issue #479). The previous `go test -race ./...` step
          # timed out at ~10min on the appshell suite — the seed-data
          # fixture insert is ~10× slower under the race detector,
          # blowing past the step timeout. GitHub Actions emailed on
          # workflow-failure even with `continue-on-error: true`,
          # so the broader suite had zero signal value and a real
          # notification cost. The narrow scope (pkg/... + the dates
          # property-test gate) is fast enough to be a real CI gate
          # (~30s on a CI runner), catches the same concurrency bug
          # class for the modules most likely to introduce one
          # (exportbridge + render — the bridge + the typst renderer
          # are the hottest concurrency surfaces in the live app),
          # and doesn't fail spuriously. The unscoped suite stays
          # available for local runs: `go test -race ./... -short
          # -count=1` from a gcc-equipped shell. Issue #479 remains
          # open for the durable fix (split the slow TestRunMutate*
          # tests or accept the 10-min timeout); when that lands the
          # narrow-scope gate can widen back to ./... in the same PR.
          $env:CGO_ENABLED = '1'
          # pkg/... is the concurrency-critical surface (the bridge
          # facade + the typst renderer) and finishes in <30s with
          # -race. The dates rapid-test below is the property-test
          # gate (issue #318 slice 3).
          go test -race ./pkg/... -short -count=1
          # PowerShell splits '-rapid.checks=500' at the '=' into
          # '-rapid' + '.checks=500' because it parses '=' as a
          # parameter binding. Quote the rapid arg so the test
          # binary receives the literal token '-rapid.checks=500'.
          # issue #417. rapid flags must follow -args so the test
          # binary receives them as test-package flags, not build
          # flags. issue #318 slice 3 + issue #417.
          go test -race ./internal/dates/... -short -count=1 -args '-rapid.checks=500'
        timeout-minutes: 5

      # Issue #591 — bake-bootstrap lint. Catches the
      # bootstrap-ordering bug class from #588 by asserting
      # every scripts/bake-*/main.go does NOT import the
      # package it is responsible for generating. Cheap (~1s);
      # informational probe + a 5s --strict gate so PRs that
      # add a new bake-style generator can't reintroduce the
      # chicken-egg between the bake script's import and the
      # gitignored generated baked.go.
      - name: lint-bake-bootstrap (informational)
        shell: pwsh
        run: |
          node audit/lint_bake_bootstrap.mjs
        timeout-minutes: 1

      - name: lint-bake-bootstrap (strict gate)
        shell: pwsh
        run: |
          node audit/lint_bake_bootstrap.mjs --strict
        timeout-minutes: 1

      # Mirror the trace harness across both build-tag modes so the
      # //go:build debug and //go:build !debug files stay in sync.
      # Without this the no-op stub in trace_nodebug.go could rot
      # silently and release builds could carry dead code from any
      # future file added with //go:build debug.
      - name: Go test (debug tag — trace harness)
        shell: pwsh
        run: |
          go test -tags debug ./internal/debug/... -short -count=1
        timeout-minutes: 5

      - name: Bump-verify (no version drift)
        if: hashFiles('internal/versioninfo/versioninfo.go') != ''
        shell: pwsh
        run: |
          pwsh -File scripts/bump-version.ps1 -VerifyOnly

      # Cli-coverage drift detector (issue #268). Asserts every
      # documented subcommand in docs/agents/cli-plan.md is
      # implemented in main.go's dispatch chain (and vice versa).
      # Same regex shape the Go binary uses; this is the offline
      # fallback so CI doesn't need a built dixiedata binary.
      # Exit 1 surfaces drift; the Go walker is the source of
      # truth in `make freshness` and the test suite locks both.
      - name: Cli-coverage drift detector
        shell: bash
        run: |
          node scripts/cli-coverage.mjs
        timeout-minutes: 2

      # htmx-guard lint (issue #316). Three static-analysis walkers
      # — toast-no-redirect (Go brace-walk), JS submit coexistence
      # (frontend/app.js), and orphan hx-target (templ files) —
      # that catch the attribute-drift bug classes documented in
      # docs/COMMON_BUGS.md §1.5, §1.8, §3.4, §3.5. Two make
      # targets chained: the strict walker is the CI gate, the
      # probe test suite is the regression net on the probe
      # itself. Same Node 20 toolchain already configured above
      # for the frontend build (actions/setup-node).
      - name: htmx-guard lint (issue #316)
        shell: bash
        run: |
          make lint-htmx-guard-strict
          make lint-htmx-guard-test
        timeout-minutes: 5

      # UX microcopy lint (issue #561). Static source scan over
      # every .templ file under internal/templates/** that catches
      # the three rule classes documented in
      # docs/agents/ux-microcopy.md (R1 eyebrow above self-
      # explanatory block, R2 heading text == adjacent button
      # text, R3 visible text duplicated within ~15 lines). The
      # probe is the executor; docs/agents/ux-microcopy.md is the
      # spec. Slice 5 flipped this gate from informational to
      # --strict because slices 2-4 brought the probe count to 0;
      # a future regression that re-introduces a violation now
      # blocks merge. Same Node 20 toolchain.
      - name: UX microcopy lint (issue #561, --strict)
        shell: bash
        run: |
          make lint-microcopy-strict
          make lint-microcopy-test
        timeout-minutes: 3

      # Static Archive microcopy lint (issue #581, Slice 1). This
      # format-aware source scan covers the inline HTML + JS viewer
      # template without applying .templ rules to CSS, plumbing, or
      # machine-readable archive data. The probe and its synthetic
      # regression suite are the regression net for Static Archive
      # shell, hash-routed pages, detail views, and print view copy.
      - name: Static Archive microcopy lint (issue #581, --strict)
        shell: bash
        run: |
          make lint-static-archive-microcopy-strict
          make lint-static-archive-microcopy-test
        timeout-minutes: 3

      # Typst PDF microcopy lint (issue #581, Slice 2). Format-aware
      # probe walks templates/**/*.typ for the canonical forbidden-
      # pattern rules (analytics_summary verbose subtitle + stacked
      # sub-headings, group_divider trailing sentence, event card
      # ALL-CAPS eyebrows, biography_appendix status-form empty
      # state) without applying `.templ` parsing to common/ helpers
      # or theme/hello smoke templates.
      - name: Typst PDF microcopy lint (issue #581, --strict)
        shell: bash
        run: |
          make lint-pdf-microcopy-strict
          make lint-pdf-microcopy-test
        timeout-minutes: 3

      # iCalendar microcopy lint (issue #581, Slice 3, audit-only).
      # Probe walks internal/archive/export_service.go for the
      # canonical iCalendar copy (calname, PRODID, SUMMARY presets,
      # DESCRIPTION lines, VALARM bodies). Slice 3 ships GREEN-on-HEAD
      # (no edits planned); the probe pins the surface so a future
      # contributor cannot drift it without breaking the CI gate.
      - name: iCalendar microcopy lint (issue #581, --strict)
        shell: bash
        run: |
          make lint-icalendar-microcopy-strict
          make lint-icalendar-microcopy-test
        timeout-minutes: 3

      # Runtime + server + startup + CLI microcopy lint (issue
      # #581, Slice 4, audit-only). Probe walks frontend/app.js +
      # internal/appshell/app.go (loading placeholder) + main.go
      # (cliHelpText) for the canonical user-facing copy that the
      # earlier three probes did not cover. Slice 4 ships
      # GREEN-on-HEAD (no edits planned); the probe pins the
      # surface so a future contributor cannot drift it without
      # breaking the CI gate.
      - name: Runtime microcopy lint (issue #581, --strict)
        shell: bash
        run: |
          make lint-runtime-microcopy-strict
          make lint-runtime-microcopy-test
        timeout-minutes: 3

      # slice 4 — CI gate). The frontend ships raw from disk via
      # internal/appshell/lifecycle.go (no bundler, no emit); the
      # only purpose of this gate is to catch the bug class the
      # baseline work uncovered:
      #   - app.js: REGRESSION NET — pins the slice-2
      #     dispatchDixieDataForm temporal-dead-zone fix and the
      #     slice-3 narrowing contracts (eventTargetElement,
      #     window.* install-once markers, per-element markers).
      #     Without these, a future refactor of dispatchDixieDataForm
      #     could re-introduce the use-before-declare that originally
      #     hit ReferenceError on the empty-name save flow.
      #   - lint-typecheck: tsc -p jsconfig.json --noEmit against
      #     all of frontend/**/*.js. Fails with code 2 if any file
      #     in app.js / debug-toolbox.js / debug.js regresses from
      #     the slice-3 zero-error baseline.
      # Both run on the existing Node 20 + npm ci toolchain that
      # already powers the CSS build above. Sequential because
      # lint-typecheck-augmentations-test exercises the augmentation
      # file shape; running it after lint-typecheck confirms the
      # typecheck itself is also clean (any TS error in the
      # augmentation surfaces in lint-typecheck first).
      - name: Frontend type-check + JS regression nets (typecheck-baseline)
        shell: bash
        run: |
          make lint-typecheck
          make lint-dispatcher-tdz-test
          make lint-typecheck-augmentations-test
        timeout-minutes: 10

      # Schema-touching detector (build-protocol.md §4). If the
      # PR has any commit subject matching feat(db) / feat(schema)
      # / fix(db) AND CurrentSchemaVersion is unchanged from the
      # base branch, fail with a drift message. The skip hatch
      # is a commit subject 'chore: skip-schema-bump' + reason
      # Issue-estimate probe (issue #619): flags open issues
      # missing the canonical `## Estimate` header. Runs on
      # PRs so a PR that opens a new issue can be caught
      # before merge. The probe is informational — it never
      # fails the build; the durable signal is the
      # `needs-info` label the operator adds after triage.
      - name: Issue-estimate probe (informational)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if (Get-Command gh -ErrorAction SilentlyContinue) {
            node audit/probe_issue_estimates.mjs
          } else {
            Write-Host "gh CLI not installed; skipping probe_issue_estimates"
          }
        continue-on-error: true
        timeout-minutes: 2

      # in the body, used for cases like a performance-only
      # index change that doesn't need a bump.
      - name: Schema-touching bump detector
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = "${{ github.base_ref }}"
          $subjects = git log --format=%s "$base..HEAD" 2>$null
          $touches = $subjects | Where-Object { $_ -match '^(feat|fix)\((db|schema)\):' -or $_ -match '^feat\(schema\):' }
          if (-not $touches) {
            Write-Host "schema-touching: no feat(db)/feat(schema)/fix(db) commits in PR"
            exit 0
          }
          $skipHatch = $subjects | Where-Object { $_ -match '^chore: skip-schema-bump' }
          if ($skipHatch) {
            Write-Host "schema-touching: skip-schema-bump hatch found, allowing PR"
            exit 0
          }
          $currentHead = (git show "HEAD:internal/versioninfo/versioninfo.go" | Select-String 'CurrentSchemaVersion\s*=\s*(\d+)').Matches[0].Groups[1].Value
          $currentBase = (git show "origin/$($base):internal/versioninfo/versioninfo.go" | Select-String 'CurrentSchemaVersion\s*=\s*(\d+)').Matches[0].Groups[1].Value
          if ($currentHead -eq $currentBase) {
            Write-Host ""
            Write-Host "DRIFT: PR #${{ github.event.pull_request.number }} touches schema but did not bump CurrentSchemaVersion." -ForegroundColor Red
            Write-Host "Touching commits:" -ForegroundColor Yellow
            $touches | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "Either:" -ForegroundColor Yellow
            Write-Host "  1. Add a 'feat(schema): bump to v$($currentBase + 1)' commit in this PR"
            Write-Host "  2. Add a 'chore: skip-schema-bump' commit + reason in body (rare; for non-shape changes)"
            exit 1
          }
          Write-Host "schema-touching: schema bumped from $currentBase to $currentHead, OK"

      # Release-counter (N) bump detector (issue #578 slice 2).
      # Issue #266 decoupled the release counter (CurrentAppVersionInt)
      # from the schema version (CONTEXT.md "Release counter N !=
      # schema version" law). The discipline ("every release bumps
      # N") was documented but unenforced; this gate enforces it.
      #
      # Scoped to PRs targeting `stable` per ADR 0009's three-branch
      # model: dev is integration, stable is releasable, the gate
      # lives where the release happens. Mirroring the schema-
      # detector literally would fail on every doc-only PR on dev.
      #
      # Bypass: a `release-counter-exempt` label (see
      # docs/agents/triage-labels.md) covers rare cases like a pure-
      # docs release that still needs to advance N for tracking.
      - name: Release-counter (N) bump detector
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'stable'
        shell: pwsh
        run: |
          $base = "${{ github.base_ref }}"
          $labels = "${{ join(github.event.pull_request.labels.*.name, '|') }}"
          if ($labels -match 'release-counter-exempt') {
            Write-Host "release-counter: release-counter-exempt label found, allowing PR"
            exit 0
          }
          $regex = 'CurrentAppVersionInt\s*=\s*(\d+)'
          $currentHead = ([regex]::Match((git show "HEAD:internal/versioninfo/versioninfo.go"), $regex)).Groups[1].Value
          $currentBase = ([regex]::Match((git show "origin/$($base):internal/versioninfo/versioninfo.go"), $regex)).Groups[1].Value
          if (-not $currentHead -or -not $currentBase) {
            Write-Host "release-counter: unable to extract CurrentAppVersionInt from base or head; gate skipped (one of the branches lacks the constant)"
            exit 0
          }
          if ($currentHead -eq $currentBase) {
            Write-Host ""
            Write-Host "DRIFT: PR #${{ github.event.pull_request.number }} targets \`stable\` but did not bump CurrentAppVersionInt." -ForegroundColor Red
            Write-Host "Base value: $currentBase" -ForegroundColor Yellow
            Write-Host "Head value: $currentHead" -ForegroundColor Yellow
            Write-Host ""
            Write-Host "Either:" -ForegroundColor Yellow
            Write-Host "  1. Run \`pwsh -File scripts/bump-version.ps1 -BumpRelease\` and commit the bump"
            Write-Host "  2. Add the \`release-counter-exempt\` label to this PR (rare; for docs-only releases advancing N for tracking)"
            exit 1
          }
          Write-Host "release-counter: CurrentAppVersionInt bumped from $currentBase to $currentHead, OK"

      # In-place update safety gate (build-protocol.md §5).
      # PRs targeting stable without one of the safety labels
      # get a STERN WARNING comment. The merge is NOT blocked
      # (per the user-decision in this PR); the warning is
      # loud and visible to the reviewer. Per ADR 0009, the
      # target is `stable` (the released-code branch), not
      # `main` (the frozen legacy branch).
      - name: In-place update safety label check
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prNumber = "${{ github.event.pull_request.number }}"
          $labelsJson = gh pr view $prNumber --json labels --jq '.labels[].name'
          $has = $false
          foreach ($l in $labelsJson) {
            if ($l -eq 'safe-for-in-place' -or $l -eq 'unsafe-for-in-place') {
              $has = $true
              break
            }
          }
          if (-not $has) {
            Write-Host ""
            Write-Host "============================================================" -ForegroundColor Yellow
            Write-Host "  STERN WARNING: PR #$prNumber to stable has NO in-place safety label." -ForegroundColor Yellow
            Write-Host "============================================================" -ForegroundColor Yellow
            Write-Host ""
            Write-Host "Every PR to stable must carry one of:" -ForegroundColor Yellow
            Write-Host "  - safe-for-in-place: reviewed against the 4 rules; safe to ship via in-place update"
            Write-Host "  - unsafe-for-in-place: intentional destructive change; explain WHY in the PR body"
            Write-Host ""
            Write-Host "This is a WARNING. The merge is NOT blocked." -ForegroundColor Yellow
            Write-Host "See docs/agents/build-protocol.md §5 for the protocol." -ForegroundColor Yellow
            gh pr comment $prNumber --body "**STERN WARNING**: This PR targets \`stable\` but has no in-place safety label. Every PR to stable must carry \`safe-for-in-place\` (reviewed against the 4 rules in [build-protocol.md §5](docs/agents/build-protocol.md#5-update-in-place-safety)) or \`unsafe-for-in-place\` (intentional destructive change with explanation). The merge is NOT blocked, but the reviewer should confirm one of the labels is applied before merge."
          } else {
            Write-Host "in-place-safety: label applied on PR #$prNumber, OK"
          }
