<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <!-- Issue #483 follow-up: the Wails asset server serves this static
       index.html for "/" WITHOUT going through the Go ServeHTTP stack,
       so the server-rendered Layout (which sets <html data-theme> from
       the persisted theme) never runs for the first paint. The shell's
       <html> had no data-theme, and the <body hx-get="/calendar"
       hx-trigger="load"> htmx swap discarded the response's
       <html data-theme> (innerHTML swap into <body> doesn't touch the
       <html> element) — so High Contrast / Soft users saw the Default
       theme on the home screen until a full-page navigation. This
       blocking (non-deferred) script fetches the persisted theme from
       the Go /boot-theme.js endpoint and sets <html data-theme> BEFORE
       the body paints, eliminating the FOUC. It must stay blocking and
       stay ahead of the body, so place it at the top of <head>. -->
  <script src="/boot-theme.js"></script>
  <script src="/boot-config.js"></script>
  <title>DixieData</title>
  <link rel="stylesheet" href="/app.css"/>
  <script defer src="/htmx.min.js"></script>
  <!-- Issue #573: shared frontend utilities. Order matters:
       debounce.js MUST load before app.js so the latter can
       reach `window.__dixieDebounce` at module-init time
       without a race. -->
  <script defer src="/lib/debounce.js"></script>
  <!-- Issue #576: shared clipboard helper. Same loading
       discipline as debounce.js — must be ahead of app.js
       so the IIFE bundle sees window.__dixieCopyText. -->
  <script defer src="/lib/clipboard.js"></script>
  <script defer src="/app.js"></script>
  <style>
    :root {
      /* --floating-dock-height: measured at runtime by
         app.js::measureFloatingDockHeight. Default matches the
         relaxed dock height + 1rem breathing room, so pages without
         JS render with the same spacing they had before. Per
         docs/COMMON_BUGS.md §4.14, the previous hand-coded padding
         regressed 5 times; this variable + JS measurement is the
         prescribed fix. */
      --floating-dock-height: 4.5rem;
    }
    body {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 26%),
        radial-gradient(circle at top right, rgba(255,255,255,0.28), transparent 18%),
        repeating-linear-gradient(135deg, rgb(var(--theme-ink-deep-rgb)/0.025) 0, rgb(var(--theme-ink-deep-rgb)/0.025) 6px, transparent 6px, transparent 18px),
        linear-gradient(180deg, var(--theme-bg-page-top) 0%, var(--theme-bg-page-mid) 42%, var(--theme-bg-page-bottom) 100%);
      color: var(--theme-text-primary);
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body hx-get="/calendar" hx-trigger="load">
  <!-- Loading card is rendered by internal/appshell/app.go::renderStartupPlaceholder
       so that copy and styling stay in one place. This shell exists for the
       brief window before the Go handler responds. -->
</body>
</html>
